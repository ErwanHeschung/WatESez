[project]
name = "watesez"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "audio-separator>=0.44.1",
    "fastapi[standard]>=0.135.2",
    "faster-whisper>=1.2.1",
    "onnxruntime>=1.24.4",
    "psycopg2-binary>=2.9.11",
    "pyacoustid>=1.3.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a reachable PostgreSQL instance",
]
