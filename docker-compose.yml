services:
  db:
    image: postgres:17-alpine
    container_name: watesez-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-watesez}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: watesez-app
    env_file: .env
    ports:
      - "8100:8100"
    volumes:
      - ./ai_models_cache:/tmp/audio-separator-models
      - whisper_cache:/models/huggingface
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          memory: 3G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8100 --workers 1
      "

volumes:
  postgres_data:
  whisper_cache:
